# fly.toml app configuration file generated for mabruk-ecommerce-api on 2026-05-18T18:06:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mabruk-ecommerce-api'
primary_region = 'gru'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
